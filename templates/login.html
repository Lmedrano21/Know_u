{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block body_class %}dark-page{% endblock %}

{% block content %}
    <section id="login">
       <div class="container">
        <h1 class="section-header">Iniciar Sesión</h1>
        <form id="form" method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Correo Electrónico</label>
            <input type="text" name="email" placeholder="Correo Electrónico" id="email" onblur="validationEmail();">
            <span id="invalidEmail" class="alert">Correo no válido</span>
            <label for="password">Contraseña</label>
            <input type="password" name="Password" placeholder="Contraseña" id="password" onblur="validPassword();">
            <span id="invalidPass" class="alert">La contraseña debe tener al menos 8 caracteres</span>

            <div class="submit">
                <button type="submit" id="btn-login">Ingresar</button> 
                <a href="{{ url_for('auth.signup') }}" id="signup">¿Nuevo cliente? Regístrate</a>
            </div>  
        </form>
       </div>
        
    </section>
{% endblock %}

{% block extra_js %}
<!-- Validation.js removido porque interfería con login backend de Flask -->
{% endblock %}
